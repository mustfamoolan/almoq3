      (function() {
        try {
          var saved = localStorage.getItem('almoq3_theme') || localStorage.getItem('mandoub_theme');
          // Default is strictly Light Mode unless user explicitly toggled to 'dark'
          if (saved === 'dark') {

            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
